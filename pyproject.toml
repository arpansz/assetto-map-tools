[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetto-map-tools"
version = "0.1.0"
description = "Open-source validation and diagnostics for Assetto Corsa map-building workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arpan Hansda" }]
keywords = ["assetto-corsa", "modding", "tracks", "maps", "obj", "blender", "validator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acvalidate = "acvalidate.cli:main"

[project.urls]
Homepage = "https://github.com/arpansz/assetto-map-tools"
Issues = "https://github.com/arpansz/assetto-map-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
